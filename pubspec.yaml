name: fitness
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.6
  google_fonts: ^5.0.0
  lottie: ^2.4.0
  shared_preferences: ^2.1.2
  wearable_rotary: ^2.0.1
  firebase_core: ^2.14.0
  firebase_auth: ^4.6.3
  google_sign_in: ^6.1.4
#  flutter_facebook_auth: ^6.0.0
  sign_in_with_apple: ^5.0.0
  crypto: ^3.0.3
  flutter_wear_os_connectivity: ^1.0.0
  cached_network_image: ^3.2.3
  flutter_statusbarcolor_ns: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/
    - assets/illustrations/
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: AlbertSans
      fonts:
        - asset: assets/google_fonts/AlbertSans-Medium.ttf
        - asset: assets/google_fonts/AlbertSans-ExtraLight.ttf
        - asset: assets/google_fonts/AlbertSans-Light.ttf
        - asset: assets/google_fonts/AlbertSans-Regular.ttf
        - asset: assets/google_fonts/AlbertSans-Bold.ttf
        - asset: assets/google_fonts/AlbertSans-ExtraBold.ttf
        - asset: assets/google_fonts/AlbertSans-SemiBold.ttf
        - asset: assets/google_fonts/AlbertSans-Thin.ttf
