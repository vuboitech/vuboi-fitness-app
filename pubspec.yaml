name: fitness
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.1
  wearable_rotary: ^2.0.2
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
#  flutter_facebook_auth: ^6.0.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  flutter_wear_os_connectivity: ^1.0.0
  cached_network_image: ^3.4.1
  go_router: ^14.8.0
  animated_bottom_navigation_bar: ^1.4.0
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/
    - assets/illustrations/
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: AlbertSans
      fonts:
        - asset: assets/google_fonts/AlbertSans-Medium.ttf
        - asset: assets/google_fonts/AlbertSans-ExtraLight.ttf
        - asset: assets/google_fonts/AlbertSans-Light.ttf
        - asset: assets/google_fonts/AlbertSans-Regular.ttf
        - asset: assets/google_fonts/AlbertSans-Bold.ttf
        - asset: assets/google_fonts/AlbertSans-ExtraBold.ttf
        - asset: assets/google_fonts/AlbertSans-SemiBold.ttf
        - asset: assets/google_fonts/AlbertSans-Thin.ttf
