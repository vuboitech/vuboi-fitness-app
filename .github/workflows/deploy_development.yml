name: Publish Development Apps

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.7'
          channel: 'stable'
      - run: flutter --version
      - name: Install dependencies
        run: dart pub get
